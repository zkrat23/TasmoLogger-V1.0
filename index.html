<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasmota Dashboard – Teploty & Vlhkost</title>

  <!-- Moderní font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Chart.js + časová osa + zoom plugin -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #7dd3fc;
      --border: #334155;
      --danger: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 1.25rem;
      line-height: 1.5;
    }

    .container { max-width: 1150px; margin: 0 auto; }

    h1 {
      font-size: 1.7rem;
      font-weight: 700;
      margin-bottom: 0.2rem;
    }

    .subtitle {
      color: var(--text-muted);
      margin-bottom: 1.4rem;
      font-size: 0.95rem;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 1.2rem;
      border: 1px solid var(--border);
      margin-bottom: 1.2rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    }

    /* === Ovládací panel === */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
      margin-bottom: 1rem;
    }

    .controls label {
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    .time-btn, .action-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.38rem 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.15s;
      font-family: inherit;
    }

    .time-btn:hover, .action-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .time-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #0f172a;
      font-weight: 600;
    }

    .action-btn {
      background: #0f172a;
    }

    .action-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #0f172a;
      font-weight: 600;
    }

    .action-btn.primary:hover {
      background: var(--accent-hover);
    }

    /* Vlastní rozsah Od – Do */
    .range-box {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
      background: #0f172a;
      padding: 0.7rem 0.9rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 1rem;
    }

    .range-box input[type="datetime-local"] {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.35rem 0.5rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-family: inherit;
    }

    .range-box input[type="datetime-local"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* Aktuální hodnoty */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 0.7rem;
      margin-bottom: 1.2rem;
    }

    .stat {
      background: #0f172a;
      border-radius: 12px;
      padding: 0.85rem;
      text-align: center;
      border: 1px solid var(--border);
    }

    .stat-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-bottom: 0.2rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .stat-value {
      font-size: 1.35rem;
      font-weight: 700;
    }

    .stat-value.temp { color: #f97316; }
    .stat-value.hum  { color: #38bdf8; }

    /* Graf */
    .chart-wrapper {
      position: relative;
      height: 440px;
    }

    .chart-wrapper.loading::after {
      content: "Načítám data…";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.7);
      border-radius: 12px;
      color: var(--accent);
      font-weight: 500;
      z-index: 10;
    }

    .footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-top: 0.8rem;
    }

    .hint {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 0.6rem;
    }

    @media (max-width: 650px) {
      body { padding: 0.9rem; }
      h1 { font-size: 1.35rem; }
      .chart-wrapper { height: 340px; }
      .range-box { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="container">

    <h1>Teploty & Vlhkost</h1>
    <p class="subtitle">Tasmota → ThingSpeak → Chart.js · moderní dashboard</p>

    <!-- Aktuální hodnoty -->
    <div class="stats" id="stats"></div>

    <div class="card">
      <!-- Rychlé volby času -->
      <div class="controls">
        <label>Rychlý výběr:</label>
        <button class="time-btn active" data-hours="6">6 hodin</button>
        <button class="time-btn" data-hours="12">12 hodin</button>
        <button class="time-btn" data-hours="24">24 hodin</button>
        <button class="time-btn" data-hours="72">3 dny</button>
        <button class="time-btn" data-hours="168">7 dní</button>
        <button class="time-btn" data-hours="720">30 dní</button>
      </div>

      <!-- Vlastní rozsah Od – Do -->
      <div class="range-box">
        <label>Vlastní rozsah:</label>
        <input type="datetime-local" id="dateFrom">
        <span style="color:var(--text-muted)">→</span>
        <input type="datetime-local" id="dateTo">
        <button class="action-btn primary" id="btnCustomRange">Načíst rozsah</button>
        <button class="action-btn" id="btnResetZoom">Reset zoom</button>
        <button class="action-btn" id="btnRefresh">Obnovit data</button>
      </div>

      <!-- Graf -->
      <div class="chart-wrapper" id="chartWrapper">
        <canvas id="myChart"></canvas>
      </div>

      <p class="hint">
        Tip: Zoom kolečkem myši · Posouvání = tažení levým tlačítkem · Dvojklik = reset zoomu
      </p>
    </div>

    <p class="footer" id="lastUpdate">Připravuji graf…</p>
  </div>

  <script>
    // ============================================================
    //  NASTAVENÍ – TADY SI UPRAV
    // ============================================================
    const CHANNEL_ID = "1234567";        // ← Tvoje Channel ID
    const READ_API_KEY = "";             // ← jen u privátního kanálu

    // field1–4 = teploty, field5 = vlhkost
    const FIELDS = {
      temp1: { field: 1, label: "Teplota 1", color: "#f97316" },
      temp2: { field: 2, label: "Teplota 2", color: "#fb923c" },
      temp3: { field: 3, label: "Teplota 3", color: "#fdba74" },
      temp4: { field: 4, label: "Teplota 4", color: "#fed7aa" },
      hum:   { field: 5, label: "Vlhkost",   color: "#38bdf8" }
    };
    // ============================================================

    let chart = null;
    let currentHours = 6;
    let useCustomRange = false;
    let customFrom = null;
    let customTo = null;

    // ---------- Vytvoření grafu ----------
    function createChart() {
      const ctx = document.getElementById("myChart").getContext("2d");

      chart = new Chart(ctx, {
        type: "line",
        data: { datasets: [] },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: { duration: 400 },
          interaction: {
            mode: "index",
            intersect: false
          },
          plugins: {
            legend: {
              position: "top",
              labels: {
                color: "#e2e8f0",
                usePointStyle: true,
                padding: 18,
                font: { size: 13 }
              }
            },
            tooltip: {
              backgroundColor: "#1e293b",
              titleColor: "#f8fafc",
              bodyColor: "#e2e8f0",
              borderColor: "#475569",
              borderWidth: 1,
              padding: 12,
              cornerRadius: 8,
              displayColors: true,
              callbacks: {
                title: (items) => {
                  if (!items.length) return "";
                  return new Date(items[0].parsed.x).toLocaleString("cs-CZ");
                },
                label: (item) => {
                  const v = item.parsed.y;
                  const unit = item.dataset.label.includes("Vlhkost") ? " %" : " °C";
                  return ` ${item.dataset.label}: ${v?.toFixed(1)}${unit}`;
                }
              }
            },
            // === ZOOM + PAN ===
            zoom: {
              pan: {
                enabled: true,
                mode: "x",               // posouvání jen vodorovně
                modifierKey: null
              },
              zoom: {
                wheel: { enabled: true }, // zoom kolečkem
                pinch: { enabled: true }, // zoom prsty na mobilu
                mode: "x",
                drag: {                   // alternativně lze zoomovat tažením
                  enabled: false
                }
              },
              limits: {
                x: { min: "original", max: "original" }
              }
            }
          },
          scales: {
            x: {
              type: "time",
              time: {
                tooltipFormat: "d. M. yyyy HH:mm",
                displayFormats: {
                  hour: "HH:mm",
                  day: "d. M.",
                  week: "d. M.",
                  month: "MMM yyyy"
                }
              },
              grid: { color: "#334155" },
              ticks: { color: "#94a3b8", maxRotation: 0, autoSkip: true, maxTicksLimit: 10 }
            },
            y: {
              position: "left",
              title: { display: true, text: "Teplota (°C)", color: "#94a3b8" },
              grid: { color: "#334155" },
              ticks: { color: "#94a3b8" }
            },
            y1: {
              position: "right",
              title: { display: true, text: "Vlhkost (%)", color: "#94a3b8" },
              grid: { drawOnChartArea: false },
              ticks: { color: "#94a3b8" },
              min: 0,
              max: 100
            }
          }
        }
      });
    }

    // ---------- Načtení dat ----------
    async function loadData() {
      const wrapper = document.getElementById("chartWrapper");
      wrapper.classList.add("loading");

      let url = `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?`;

      if (useCustomRange && customFrom && customTo) {
        // Vlastní rozsah Od – Do
        const start = customFrom.toISOString().slice(0, 19).replace("T", "%20");
        const end   = customTo.toISOString().slice(0, 19).replace("T", "%20");
        url += `start=${start}&end=${end}`;
      } else {
        // Rychlý výběr podle hodin
        const results = Math.min(8000, Math.round(currentHours * 12)); // cca 5min interval
        url += `results=${results}`;
      }

      if (READ_API_KEY) url += `&api_key=${READ_API_KEY}`;

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("Chyba API");

        const json = await res.json();
        let feeds = json.feeds || [];

        if (feeds.length === 0) {
          document.getElementById("lastUpdate").textContent = "Žádná data pro zvolený rozsah";
          wrapper.classList.remove("loading");
          return;
        }

        // Pokud jsme použili results=, ještě vyfiltrujeme přesný čas
        if (!useCustomRange) {
          const cutoff = Date.now() - (currentHours * 3600 * 1000);
          feeds = feeds.filter(f => new Date(f.created_at).getTime() >= cutoff);
        }

        // Vytvoříme datasety
        const datasets = Object.values(FIELDS).map(cfg => {
          const isHum = cfg.field === 5;
          return {
            label: cfg.label,
            data: feeds
              .map(f => ({
                x: new Date(f.created_at),
                y: parseFloat(f[`field${cfg.field}`])
              }))
              .filter(p => !isNaN(p.y)),
            borderColor: cfg.color,
            backgroundColor: cfg.color + "22",
            borderWidth: 2.2,
            pointRadius: 0,
            pointHoverRadius: 5,
            pointHoverBorderWidth: 2,
            tension: 0.3,
            yAxisID: isHum ? "y1" : "y",
            fill: false
          };
        });

        chart.data.datasets = datasets;
        chart.update("none");

        // Aktualizujeme aktuální hodnoty
        updateStats(feeds[feeds.length - 1]);

        const first = new Date(feeds[0].created_at);
        const last  = new Date(feeds[feeds.length - 1].created_at);
        document.getElementById("lastUpdate").textContent =
          `Zobrazeno: ${first.toLocaleString("cs-CZ")} → ${last.toLocaleString("cs-CZ")} · ${feeds.length} bodů`;

      } catch (err) {
        console.error(err);
        document.getElementById("lastUpdate").textContent = "Chyba načítání – zkontroluj Channel ID a připojení";
      }

      wrapper.classList.remove("loading");
    }

    // ---------- Aktuální hodnoty nahoře ----------
    function updateStats(last) {
      if (!last) return;
      const html = Object.values(FIELDS).map(cfg => {
        const val = parseFloat(last[`field${cfg.field}`]);
        const unit = cfg.field === 5 ? " %" : " °C";
        const cls = cfg.field === 5 ? "hum" : "temp";
        return `
          <div class="stat">
            <div class="stat-label">${cfg.label}</div>
            <div class="stat-value ${cls}">${isNaN(val) ? "–" : val.toFixed(1) + unit}</div>
          </div>`;
      }).join("");
      document.getElementById("stats").innerHTML = html;
    }

    // ---------- Eventy ----------
    // Rychlé tlačítka
    document.querySelectorAll(".time-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".time-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        useCustomRange = false;
        currentHours = parseInt(btn.dataset.hours);
        loadData();
      });
    });

    // Vlastní rozsah
    document.getElementById("btnCustomRange").addEventListener("click", () => {
      const fromVal = document.getElementById("dateFrom").value;
      const toVal   = document.getElementById("dateTo").value;

      if (!fromVal || !toVal) {
        alert("Vyplň prosím obě pole Od i Do");
        return;
      }

      customFrom = new Date(fromVal);
      customTo   = new Date(toVal);

      if (customFrom >= customTo) {
        alert("Datum „Od“ musí být dříve než „Do“");
        return;
      }

      // Odstraníme aktivní rychlé tlačítko
      document.querySelectorAll(".time-btn").forEach(b => b.classList.remove("active"));
      useCustomRange = true;
      loadData();
    });

    // Reset zoom
    document.getElementById("btnResetZoom").addEventListener("click", () => {
      chart.resetZoom();
    });

    // Obnovit data
    document.getElementById("btnRefresh").addEventListener("click", () => {
      loadData();
    });

    // Dvojklik na graf = reset zoom
    document.getElementById("myChart").addEventListener("dblclick", () => {
      chart.resetZoom();
    });

    // Předvyplníme datumy (posledních 24 hodin)
    function prefillDates() {
      const now = new Date();
      const from = new Date(now.getTime() - 24 * 3600 * 1000);

      // datetime-local chce formát YYYY-MM-DDTHH:MM
      const toLocal = d => {
        const pad = n => String(n).padStart(2, "0");
        return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
      };

      document.getElementById("dateFrom").value = toLocal(from);
      document.getElementById("dateTo").value = toLocal(now);
    }

    // ---------- Start ----------
    createChart();
    prefillDates();
    loadData();

    // Automatická aktualizace každou minutu (jen když není vlastní rozsah)
    setInterval(() => {
      if (!useCustomRange) loadData();
    }, 60 * 1000);
  </script>
</body>
  </html>
