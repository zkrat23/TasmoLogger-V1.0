<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasmota Dashboard – Teploty a vlhkost</title>

  <!-- Načteme moderní font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Chart.js z CDN (funguje i na GitHub Pages) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Plugin pro hezčí formátování času na ose X -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

  <style>
    /* ========== ZÁKLADNÍ STYLY – moderní tmavý vzhled ========== */
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 1.5rem;
      line-height: 1.5;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }

    /* Karty */
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 1.25rem;
      border: 1px solid var(--border);
      margin-bottom: 1.25rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }

    /* Ovládací panel – výběr času */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
      align-items: center;
    }

    .controls label {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-right: 0.5rem;
    }

    .time-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.875rem;
      transition: all 0.2s;
    }

    .time-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .time-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #0f172a;
      font-weight: 600;
    }

    /* Aktuální hodnoty nahoře */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .stat {
      background: #0f172a;
      border-radius: 12px;
      padding: 0.9rem;
      text-align: center;
      border: 1px solid var(--border);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .stat-value {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .stat-value.temp { color: #f97316; }
    .stat-value.hum  { color: #38bdf8; }

    /* Graf */
    .chart-wrapper {
      position: relative;
      height: 420px;
    }

    /* Info o poslední aktualizaci */
    .footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-top: 1rem;
    }

    /* Responzivita pro mobil */
    @media (max-width: 600px) {
      body { padding: 1rem; }
      h1 { font-size: 1.4rem; }
      .chart-wrapper { height: 320px; }
    }
  </style>
</head>
<body>
  <div class="container">

    <h1>Teploty & Vlhkost</h1>
    <p class="subtitle">Data z Tasmoty přes ThingSpeak · aktualizace každých 60 sekund</p>

    <!-- Aktuální hodnoty (poslední naměřené) -->
    <div class="stats" id="stats">
      <!-- Naplní se JavaScriptem -->
    </div>

    <div class="card">
      <!-- Volba časového rozsahu -->
      <div class="controls">
        <label>Časová osa:</label>
        <button class="time-btn active" data-hours="6">6 hodin</button>
        <button class="time-btn" data-hours="12">12 hodin</button>
        <button class="time-btn" data-hours="24">24 hodin</button>
        <button class="time-btn" data-hours="72">3 dny</button>
        <button class="time-btn" data-hours="168">7 dní</button>
      </div>

      <!-- Samotný graf -->
      <div class="chart-wrapper">
        <canvas id="myChart"></canvas>
      </div>
    </div>

    <p class="footer" id="lastUpdate">Načítám data…</p>
  </div>

  <script>
    // ============================================================
    //  NASTAVENÍ – TADY SI UPRAV PODLE SEBE
    // ============================================================

    // Tvoje Channel ID z ThingSpeak (najdeš v nastavení kanálu)
    const CHANNEL_ID = "1234567";          // ← ZMĚŇ NA SVÉ ČÍSLO

    // Read API Key (jen pokud je kanál PRIVÁTNÍ). U veřejného nech prázdné "".
    const READ_API_KEY = "";               // ← případně doplň

    // Které fieldy v ThingSpeak odpovídají čemu
    // field1, field2, field3, field4 = teploty
    // field5 = vlhkost
    const FIELDS = {
      temp1: { field: 1, label: "Teplota 1", color: "#f97316" },
      temp2: { field: 2, label: "Teplota 2", color: "#fb923c" },
      temp3: { field: 3, label: "Teplota 3", color: "#fdba74" },
      temp4: { field: 4, label: "Teplota 4", color: "#fed7aa" },
      hum:   { field: 5, label: "Vlhkost",   color: "#38bdf8" }
    };

    // ============================================================
    //  DÁL UŽ NIC NEMĚŇ, POKUD NEVÍŠ CO DĚLÁŠ
    // ============================================================

    let chart = null;          // instance grafu
    let currentHours = 6;      // aktuálně vybraný časový rozsah

    // ---------- Vytvoření grafu (jednou na začátku) ----------
    function createChart() {
      const ctx = document.getElementById("myChart").getContext("2d");

      chart = new Chart(ctx, {
        type: "line",
        data: {
          datasets: []   // naplníme později
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: "index",        // při najetí myší ukáže všechny hodnoty v daném čase
            intersect: false
          },
          plugins: {
            legend: {
              position: "top",
              labels: {
                color: "#e2e8f0",
                usePointStyle: true,
                padding: 16,
                font: { size: 13 }
              }
            },
            tooltip: {
              backgroundColor: "#1e293b",
              titleColor: "#f1f5f9",
              bodyColor: "#e2e8f0",
              borderColor: "#334155",
              borderWidth: 1,
              padding: 12,
              callbacks: {
                // Hezčí formátování tooltipu
                title: (items) => {
                  if (!items.length) return "";
                  const date = new Date(items[0].parsed.x);
                  return date.toLocaleString("cs-CZ");
                },
                label: (item) => {
                  const value = item.parsed.y;
                  const unit = item.dataset.label.includes("Vlhkost") ? " %" : " °C";
                  return ` ${item.dataset.label}: ${value.toFixed(1)}${unit}`;
                }
              }
            }
          },
          scales: {
            x: {
              type: "time",                 // časová osa
              time: {
                tooltipFormat: "d. M. yyyy HH:mm",
                displayFormats: {
                  hour: "HH:mm",
                  day: "d. M."
                }
              },
              grid: { color: "#334155" },
              ticks: { color: "#94a3b8", maxRotation: 0 }
            },
            y: {
              position: "left",
              title: {
                display: true,
                text: "Teplota (°C)",
                color: "#94a3b8"
              },
              grid: { color: "#334155" },
              ticks: { color: "#94a3b8" }
            },
            y1: {
              position: "right",
              title: {
                display: true,
                text: "Vlhkost (%)",
                color: "#94a3b8"
              },
              grid: { drawOnChartArea: false },  // mřížka jen zleva
              ticks: { color: "#94a3b8" },
              min: 0,
              max: 100
            }
          }
        }
      });
    }

    // ---------- Načtení dat z ThingSpeak ----------
    async function loadData(hours) {
      // Kolik bodů přibližně chceme (ThingSpeak free má limit ~8000)
      // 1 bod za 5 minut → za 24 h = 288 bodů
      const results = Math.min(8000, Math.round(hours * 12)); // cca každých 5 min

      const url = `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?results=${results}` +
                  (READ_API_KEY ? `&api_key=${READ_API_KEY}` : "");

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("Chyba při načítání dat z ThingSpeak");

        const json = await res.json();
        const feeds = json.feeds || [];

        if (feeds.length === 0) {
          document.getElementById("lastUpdate").textContent = "Žádná data v kanálu";
          return;
        }

        // Filtrujeme data podle zvoleného časového rozsahu
        const now = Date.now();
        const cutoff = now - (hours * 60 * 60 * 1000);
        const filtered = feeds.filter(f => new Date(f.created_at).getTime() >= cutoff);

        // Připravíme datasety pro graf
        const datasets = Object.values(FIELDS).map(cfg => {
          const isHumidity = cfg.field === 5;
          return {
            label: cfg.label,
            data: filtered.map(f => ({
              x: new Date(f.created_at),
              y: parseFloat(f[`field${cfg.field}`]) || null
            })).filter(p => p.y !== null),
            borderColor: cfg.color,
            backgroundColor: cfg.color + "33",   // průhledná výplň
            borderWidth: 2,
            pointRadius: 0,                      // body skryté (při najetí se objeví)
            pointHoverRadius: 5,
            tension: 0.25,                       // jemné zakřivení
            yAxisID: isHumidity ? "y1" : "y",    // vlhkost na pravé ose
            fill: false
          };
        });

        // Aktualizujeme graf
        chart.data.datasets = datasets;
        chart.update("none");   // "none" = bez animace (rychlejší)

        // Aktualizujeme aktuální hodnoty nahoře
        updateStats(filtered[filtered.length - 1]);

        // Text o poslední aktualizaci
        const last = new Date(filtered[filtered.length - 1].created_at);
        document.getElementById("lastUpdate").textContent =
          `Poslední data: ${last.toLocaleString("cs-CZ")} · Celkem bodů: ${filtered.length}`;

      } catch (err) {
        console.error(err);
        document.getElementById("lastUpdate").textContent = "Chyba načítání dat – zkontroluj Channel ID";
      }
    }

    // ---------- Aktuální hodnoty nahoře ----------
    function updateStats(lastFeed) {
      if (!lastFeed) return;

      const html = Object.values(FIELDS).map(cfg => {
        const val = parseFloat(lastFeed[`field${cfg.field}`]);
        const unit = cfg.field === 5 ? " %" : " °C";
        const cls = cfg.field === 5 ? "hum" : "temp";
        return `
          <div class="stat">
            <div class="stat-label">${cfg.label}</div>
            <div class="stat-value ${cls}">${isNaN(val) ? "–" : val.toFixed(1) + unit}</div>
          </div>
        `;
      }).join("");

      document.getElementById("stats").innerHTML = html;
    }

    // ---------- Ovládání tlačítek časové osy ----------
    document.querySelectorAll(".time-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        // Odstraníme aktivní třídu ze všech
        document.querySelectorAll(".time-btn").forEach(b => b.classList.remove("active"));
        // Přidáme na kliknuté
        btn.classList.add("active");

        currentHours = parseInt(btn.dataset.hours);
        loadData(currentHours);
      });
    });

    // ---------- Start ----------
    createChart();
    loadData(currentHours);

    // Automatická aktualizace každou minutu
    setInterval(() => loadData(currentHours), 60 * 1000);
  </script>
</body>
  </html>
