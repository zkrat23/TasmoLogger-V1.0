<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasmota Dashboard – Teploty a vlhkost</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 1.5rem;
      line-height: 1.5;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.25rem; }
    .subtitle { color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.95rem; }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 1.25rem;
      border: 1px solid var(--border);
      margin-bottom: 1.25rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
      align-items: center;
    }

    .controls label {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-right: 0.5rem;
    }

    .time-btn, .nav-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.875rem;
      transition: all 0.2s;
      min-width: 42px;
    }

    .time-btn:hover, .nav-btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .time-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #0f172a;
      font-weight: 600;
    }

    .nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Navigace pod grafem */
    .nav-controls {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1.1rem;
      align-items: center;
    }

    .nav-label {
      color: var(--text-muted);
      font-size: 0.85rem;
      min-width: 180px;
      text-align: center;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .stat {
      background: #0f172a;
      border-radius: 12px;
      padding: 0.9rem;
      text-align: center;
      border: 1px solid var(--border);
    }

    .stat-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.25rem; }
    .stat-value { font-size: 1.4rem; font-weight: 700; }
    .stat-value.temp { color: #f97316; }
    .stat-value.hum  { color: #38bdf8; }

    .chart-wrapper { position: relative; height: 420px; }

    .footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-top: 1rem;
    }

    @media (max-width: 600px) {
      body { padding: 1rem; }
      h1 { font-size: 1.4rem; }
      .chart-wrapper { height: 320px; }
      .nav-label { min-width: 120px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <div class="container">

    <h1>Teploty & Vlhkost</h1>
    <p class="subtitle">Data z Tasmoty přes ThingSpeak · aktualizace každých 60 sekund</p>

    <div class="stats" id="stats"></div>

    <div class="card">
      <!-- Volba délky období -->
      <div class="controls">
        <label>Období:</label>
        <button class="time-btn active" data-hours="6">6 hodin</button>
        <button class="time-btn" data-hours="12">12 hodin</button>
        <button class="time-btn" data-hours="24">24 hodin</button>
        <button class="time-btn" data-hours="72">3 dny</button>
        <button class="time-btn" data-hours="168">7 dní</button>
      </div>

      <div class="chart-wrapper">
        <canvas id="myChart"></canvas>
      </div>

      <!-- Šipky pro posun v čase -->
      <div class="nav-controls">
        <button class="nav-btn" id="btnOlder" title="Starší data">←</button>
        <span class="nav-label" id="rangeLabel">Aktuální období</span>
        <button class="nav-btn" id="btnNewer" title="Novější data" disabled>→</button>
      </div>
    </div>

    <p class="footer" id="lastUpdate">Načítám data…</p>
  </div>

  <script>
    // ============================================================
    //  NASTAVENÍ – TADY SI UPRAV PODLE SEBE
    // ============================================================
    const CHANNEL_ID = "1234567";          // ← ZMĚŇ NA SVÉ CHANNEL ID
    const READ_API_KEY = "";               // ← jen u privátního kanálu

    const FIELDS = {
      temp1: { field: 1, label: "Teplota 1", color: "#f97316" },
      temp2: { field: 2, label: "Teplota 2", color: "#fb923c" },
      temp3: { field: 3, label: "Teplota 3", color: "#fdba74" },
      temp4: { field: 4, label: "Teplota 4", color: "#fed7aa" },
      hum:   { field: 5, label: "Vlhkost",   color: "#38bdf8" }
    };
    // ============================================================

    let chart = null;
    let currentHours = 6;       // délka zobrazovaného okna
    let offsetHours = 0;        // o kolik hodin jsme posunuti do minulosti (0 = teď)

    // ---------- Vytvoření grafu ----------
    function createChart() {
      const ctx = document.getElementById("myChart").getContext("2d");

      chart = new Chart(ctx, {
        type: "line",
        data: { datasets: [] },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: "index",
            intersect: false
          },
          plugins: {
            legend: {
              position: "top",
              labels: {
                color: "#e2e8f0",
                usePointStyle: true,
                padding: 16,
                font: { size: 13 }
              }
            },
            tooltip: {
              backgroundColor: "#1e293b",
              titleColor: "#f1f5f9",
              bodyColor: "#e2e8f0",
              borderColor: "#334155",
              borderWidth: 1,
              padding: 12,
              callbacks: {
                title: (items) => {
                  if (!items.length) return "";
                  return new Date(items[0].parsed.x).toLocaleString("cs-CZ");
                },
                label: (item) => {
                  const value = item.parsed.y;
                  const unit = item.dataset.label.includes("Vlhkost") ? " %" : " °C";
                  return ` ${item.dataset.label}: ${value.toFixed(1)}${unit}`;
                }
              }
            }
          },
          scales: {
            x: {
              type: "time",
              time: {
                tooltipFormat: "d. M. yyyy HH:mm",
                displayFormats: {
                  hour: "HH:mm",
                  day: "d. M."
                }
              },
              grid: { color: "#334155" },
              ticks: { color: "#94a3b8", maxRotation: 0 },
              // min a max budeme nastavovat dynamicky
            },
            y: {
              position: "left",
              title: { display: true, text: "Teplota (°C)", color: "#94a3b8" },
              grid: { color: "#334155" },
              ticks: { color: "#94a3b8" }
            },
            y1: {
              position: "right",
              title: { display: true, text: "Vlhkost (%)", color: "#94a3b8" },
              grid: { drawOnChartArea: false },
              ticks: { color: "#94a3b8" },
              min: 0,
              max: 100
            }
          }
        }
      });
    }

    // ---------- Načtení dat ----------
    async function loadData() {
      // Vypočítáme začátek a konec zobrazovaného okna
      const now = Date.now();
      const endTime   = now - (offsetHours * 60 * 60 * 1000);
      const startTime = endTime - (currentHours * 60 * 60 * 1000);

      // Formát pro ThingSpeak (YYYY-MM-DD HH:MM:SS)
      const formatDate = (ms) => {
        const d = new Date(ms);
        return d.toISOString().slice(0, 19).replace("T", " ");
      };

      const startStr = formatDate(startTime);
      const endStr   = formatDate(endTime);

      // Požadujeme víc bodů, ať máme rezervu
      const results = Math.min(8000, Math.round(currentHours * 12) + 50);

      let url = `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?results=${results}` +
                `&start=${encodeURIComponent(startStr)}&end=${encodeURIComponent(endStr)}`;

      if (READ_API_KEY) url += `&api_key=${READ_API_KEY}`;

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("Chyba při načítání dat");

        const json = await res.json();
        const feeds = json.feeds || [];

        // Datasety
        const datasets = Object.values(FIELDS).map(cfg => {
          const isHumidity = cfg.field === 5;
          return {
            label: cfg.label,
            data: feeds.map(f => ({
              x: new Date(f.created_at),
              y: parseFloat(f[`field${cfg.field}`]) || null
            })).filter(p => p.y !== null),
            borderColor: cfg.color,
            backgroundColor: cfg.color + "33",
            borderWidth: 2,
            pointRadius: 0,
            pointHoverRadius: 5,
            tension: 0.25,
            yAxisID: isHumidity ? "y1" : "y",
            fill: false
          };
        });

        chart.data.datasets = datasets;

        // *** Důležité: pevně nastavíme začátek a konec osy X ***
        chart.options.scales.x.min = startTime;
        chart.options.scales.x.max = endTime;

        chart.update("none");

        // Aktuální hodnoty (jen když jsme na nejnovějším okně)
        if (offsetHours === 0 && feeds.length > 0) {
          updateStats(feeds[feeds.length - 1]);
        }

        // Popisek rozsahu
        const from = new Date(startTime).toLocaleString("cs-CZ", { day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" });
        const to   = new Date(endTime).toLocaleString("cs-CZ", { day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" });
        document.getElementById("rangeLabel").textContent = `${from} – ${to}`;

        // Stav šipek
        document.getElementById("btnNewer").disabled = (offsetHours === 0);

        // Info dole
        const lastText = feeds.length > 0
          ? `Načteno ${feeds.length} bodů`
          : "V tomto období nejsou žádná data";
        document.getElementById("lastUpdate").textContent = lastText;

      } catch (err) {
        console.error(err);
        document.getElementById("lastUpdate").textContent = "Chyba načítání – zkontroluj Channel ID";
      }
    }

    // ---------- Aktuální hodnoty nahoře ----------
    function updateStats(lastFeed) {
      if (!lastFeed) return;
      const html = Object.values(FIELDS).map(cfg => {
        const val = parseFloat(lastFeed[`field${cfg.field}`]);
        const unit = cfg.field === 5 ? " %" : " °C";
        const cls = cfg.field === 5 ? "hum" : "temp";
        return `
          <div class="stat">
            <div class="stat-label">${cfg.label}</div>
            <div class="stat-value ${cls}">${isNaN(val) ? "–" : val.toFixed(1) + unit}</div>
          </div>
        `;
      }).join("");
      document.getElementById("stats").innerHTML = html;
    }

    // ---------- Tlačítka období ----------
    document.querySelectorAll(".time-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".time-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentHours = parseInt(btn.dataset.hours);
        offsetHours = 0;               // při změně období skočíme na současnost
        loadData();
      });
    });

    // ---------- Šipky posunu ----------
    document.getElementById("btnOlder").addEventListener("click", () => {
      offsetHours += currentHours;     // posuneme se o celé období dozadu
      loadData();
    });

    document.getElementById("btnNewer").addEventListener("click", () => {
      offsetHours = Math.max(0, offsetHours - currentHours);
      loadData();
    });

    // ---------- Start ----------
    createChart();
    loadData();

    // Automatická aktualizace jen když jsme na aktuálním okně
    setInterval(() => {
      if (offsetHours === 0) loadData();
    }, 60 * 1000);
  </script>
</body>
  </html>
