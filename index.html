<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasmota Dashboard – Teploty a vlhkost</title>

  <!-- Moderní font Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Chart.js + podpora časové osy -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

  <style>
    /* ========== ZÁKLADNÍ BARVY A PROMĚNNÉ ========== */
    :root {
      --bg: #0f172a;           /* pozadí stránky */
      --card: #1e293b;         /* pozadí karet */
      --text: #f1f5f9;         /* hlavní text */
      --text-muted: #94a3b8;   /* šedý text */
      --accent: #38bdf8;       /* zvýrazňující modrá */
      --border: #334155;       /* ohraničení */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 1.5rem;
      line-height: 1.5;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }

    /* Karta kolem grafu */
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 1.25rem;
      border: 1px solid var(--border);
      margin-bottom: 1.25rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }

    /* Společné styly pro řady tlačítek */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.9rem;
      align-items: center;
    }

    .controls label {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-right: 0.4rem;
      min-width: 70px;
    }

    /* Tlačítka období i posunu */
    .time-btn, .step-btn, .nav-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.875rem;
      transition: all 0.2s;
      min-width: 42px;
    }

    .time-btn:hover,
    .step-btn:hover,
    .nav-btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Aktivní tlačítko (vybrané období / krok) */
    .time-btn.active,
    .step-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #0f172a;
      font-weight: 600;
    }

    /* Vypnutá šipka */
    .nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Řádek se šipkami */
    .nav-controls {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1.1rem;
      margin-bottom: 0.9rem;
      align-items: center;
    }

    .nav-label {
      color: var(--text-muted);
      font-size: 0.85rem;
      min-width: 190px;
      text-align: center;
    }

    /* Karty s aktuálními hodnotami nahoře */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .stat {
      background: #0f172a;
      border-radius: 12px;
      padding: 0.9rem;
      text-align: center;
      border: 1px solid var(--border);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .stat-value {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .stat-value.temp { color: #f97316; }   /* oranžová pro teploty */
    .stat-value.hum  { color: #38bdf8; }   /* modrá pro vlhkost */

    .chart-wrapper {
      position: relative;
      height: 420px;
    }

    /* Spodní informační řádek */
    .footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-top: 1rem;
    }

    /* Úpravy pro mobil */
    @media (max-width: 600px) {
      body { padding: 1rem; }
      h1 { font-size: 1.4rem; }
      .chart-wrapper { height: 320px; }
      .nav-label { min-width: 130px; font-size: 0.8rem; }
      .controls label { min-width: auto; }
    }
  </style>
</head>
<body>
  <div class="container">

    <h1>Teploty & Vlhkost</h1>
    <p class="subtitle">Data z Tasmoty přes ThingSpeak · aktualizace každých 60 sekund</p>

    <!-- Aktuální hodnoty (poslední naměřené) -->
    <div class="stats" id="stats"></div>

    <div class="card">

      <!-- ========== 1. VOLBA DÉLKY OBDOBÍ (jak široké okno grafu) ========== -->
      <div class="controls">
        <label>Období:</label>
        <button class="time-btn" data-hours="0.5">30m</button>
        <button class="time-btn" data-hours="1">1h</button>
        <button class="time-btn" data-hours="2">2h</button>
        <button class="time-btn" data-hours="3">3h</button>
        <button class="time-btn active" data-hours="6">6h</button>
        <button class="time-btn" data-hours="12">12h</button>
        <button class="time-btn" data-hours="24">24h</button>
        <button class="time-btn" data-hours="72">3d</button>
        <button class="time-btn" data-hours="168">7d</button>
      </div>

      <!-- Graf -->
      <div class="chart-wrapper">
        <canvas id="myChart"></canvas>
      </div>

      <!-- ========== 2. ŠIPKY PRO POSUN V ČASE ========== -->
      <div class="nav-controls">
        <button class="nav-btn" id="btnOlder" title="Posunout do minulosti">←</button>
        <span class="nav-label" id="rangeLabel">Aktuální období</span>
        <button class="nav-btn" id="btnNewer" title="Posunout k současnosti" disabled>→</button>
      </div>

      <!-- ========== 3. VOLBA VELIKOSTI KROKU (o kolik se šipky posunou) ========== -->
      <div class="controls">
        <label>Posun o:</label>
        <button class="step-btn" data-hours="0.5">30m</button>
        <button class="step-btn" data-hours="1">1h</button>
        <button class="step-btn active" data-hours="3">3h</button>
        <button class="step-btn" data-hours="6">6h</button>
        <button class="step-btn" data-hours="12">12h</button>
        <button class="step-btn" data-hours="24">24h</button>
        <button class="step-btn" data-hours="72">3d</button>
      </div>

    </div>

    <!-- Spodní řádek s informacemi -->
    <p class="footer" id="lastUpdate">Načítám data…</p>
  </div>

  <script>
    // =====================================================================
    //  NASTAVENÍ – TADY UPRAVUJ
    // =====================================================================

    // Channel ID z ThingSpeak (najdeš v nastavení svého kanálu)
    const CHANNEL_ID = "1234567";          // ← ZMĚŇ NA SVÉ ČÍSLO

    // Read API Key – vyplň jen když je kanál PRIVÁTNÍ, jinak nech prázdné
    const READ_API_KEY = "";

    // Mapování fieldů z ThingSpeak na názvy a barvy
    // field1–4 = teploty, field5 = vlhkost
    const FIELDS = {
      temp1: { field: 1, label: "Teplota 1", color: "#f97316" },
      temp2: { field: 2, label: "Teplota 2", color: "#fb923c" },
      temp3: { field: 3, label: "Teplota 3", color: "#fdba74" },
      temp4: { field: 4, label: "Teplota 4", color: "#fed7aa" },
      hum:   { field: 5, label: "Vlhkost",   color: "#38bdf8" }
    };

    // =====================================================================
    //  PROMĚNNÉ, KTERÉ SI SKRIPT PAMATUJE
    // =====================================================================

    let chart = null;            // instance grafu Chart.js
    let currentHours = 6;        // jak široké je aktuálně zobrazené okno (v hodinách)
    let offsetHours = 0;         // o kolik hodin jsme posunuti do minulosti (0 = nejsme)
    let stepHours = 3;           // o kolik hodin se posuneme po kliknutí na šipku

    // =====================================================================
    //  VYTVOŘENÍ GRAFU (zavolá se jen jednou při startu)
    // =====================================================================
    function createChart() {
      const ctx = document.getElementById("myChart").getContext("2d");

      chart = new Chart(ctx, {
        type: "line",
        data: {
          datasets: []          // data se doplní později funkcí loadData()
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,

          // Při najetí myší ukáže všechny hodnoty ve stejném čase
          interaction: {
            mode: "index",
            intersect: false
          },

          plugins: {
            // Legenda nahoře
            legend: {
              position: "top",
              labels: {
                color: "#e2e8f0",
                usePointStyle: true,
                padding: 16,
                font: { size: 13 }
              }
            },

            // Tooltip (bublina s hodnotami)
            tooltip: {
              backgroundColor: "#1e293b",
              titleColor: "#f1f5f9",
              bodyColor: "#e2e8f0",
              borderColor: "#334155",
              borderWidth: 1,
              padding: 12,
              callbacks: {
                // Nadpis tooltipu = datum a čas
                title: (items) => {
                  if (!items.length) return "";
                  return new Date(items[0].parsed.x).toLocaleString("cs-CZ");
                },
                // Jednotlivé řádky = název + hodnota + jednotka
                label: (item) => {
                  const value = item.parsed.y;
                  const unit = item.dataset.label.includes("Vlhkost") ? " %" : " °C";
                  return ` ${item.dataset.label}: ${value.toFixed(1)}${unit}`;
                }
              }
            }
          },

          scales: {
            // Osa X = čas
            x: {
              type: "time",
              time: {
                tooltipFormat: "d. M. yyyy HH:mm",
                displayFormats: {
                  hour: "HH:mm",
                  day: "d. M."
                }
              },
              grid: { color: "#334155" },
              ticks: { color: "#94a3b8", maxRotation: 0 }
              // min a max se nastavují dynamicky v loadData()
            },

            // Levá osa Y = teplota
            y: {
              position: "left",
              title: {
                display: true,
                text: "Teplota (°C)",
                color: "#94a3b8"
              },
              grid: { color: "#334155" },
              ticks: { color: "#94a3b8" }
            },

            // Pravá osa Y = vlhkost
            y1: {
              position: "right",
              title: {
                display: true,
                text: "Vlhkost (%)",
                color: "#94a3b8"
              },
              grid: { drawOnChartArea: false },   // mřížku kreslíme jen zleva
              ticks: { color: "#94a3b8" },
              min: 0,
              max: 100
            }
          }
        }
      });
    }

    // =====================================================================
    //  NAČTENÍ DAT Z THINGSPEAK + VYKRESLENÍ
    // =====================================================================
    async function loadData() {
      // Spočítáme začátek a konec okna, které chceme zobrazit
      const now = Date.now();
      const endTime   = now - (offsetHours * 60 * 60 * 1000);          // konec okna
      const startTime = endTime - (currentHours * 60 * 60 * 1000);     // začátek okna

      // Převedeme čas do formátu, který chce ThingSpeak (YYYY-MM-DD HH:MM:SS)
      const formatDate = (ms) => {
        const d = new Date(ms);
        return d.toISOString().slice(0, 19).replace("T", " ");
      };

      const startStr = formatDate(startTime);
      const endStr   = formatDate(endTime);

      // Kolik bodů maximálně chceme (ThingSpeak free má limit cca 8000)
      const results = Math.min(8000, Math.round(currentHours * 12) + 80);

      // Složení adresy API
      let url = `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json` +
                `?results=${results}` +
                `&start=${encodeURIComponent(startStr)}` +
                `&end=${encodeURIComponent(endStr)}`;

      // Pokud máme API klíč, přidáme ho
      if (READ_API_KEY) {
        url += `&api_key=${READ_API_KEY}`;
      }

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("Nepodařilo se načíst data z ThingSpeak");

        const json = await res.json();
        const feeds = json.feeds || [];

        // Připravíme datasety pro každou veličinu (4 teploty + vlhkost)
        const datasets = Object.values(FIELDS).map(cfg => {
          const isHumidity = cfg.field === 5;

          return {
            label: cfg.label,
            data: feeds
              .map(f => ({
                x: new Date(f.created_at),
                y: parseFloat(f[`field${cfg.field}`]) || null
              }))
              .filter(p => p.y !== null),          // vyhodíme prázdné hodnoty

            borderColor: cfg.color,
            backgroundColor: cfg.color + "33",     // velmi průhledná barva
            borderWidth: 2,
            pointRadius: 0,                        // body schované
            pointHoverRadius: 5,                   // při najetí se objeví
            tension: 0.25,                         // jemné zakřivení čáry
            yAxisID: isHumidity ? "y1" : "y",      // vlhkost jde na pravou osu
            fill: false
          };
        });

        // Nahrajeme data do grafu
        chart.data.datasets = datasets;

        // *** Nejdůležitější část ***
        // Osa X bude VŽDY přesně tak dlouhá, jak jsme zvolili v „Období“
        // (i když data existují jen za část intervalu)
        chart.options.scales.x.min = startTime;
        chart.options.scales.x.max = endTime;

        chart.update("none");   // "none" = bez animace (rychlejší)

        // Aktualizujeme karty s aktuálními hodnotami
        // (pouze když se díváme na nejnovější období)
        if (offsetHours === 0 && feeds.length > 0) {
          updateStats(feeds[feeds.length - 1]);
        }

        // Text uprostřed mezi šipkami = přesný časový rozsah
        const opts = { day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" };
        const from = new Date(startTime).toLocaleString("cs-CZ", opts);
        const to   = new Date(endTime).toLocaleString("cs-CZ", opts);
        document.getElementById("rangeLabel").textContent = `${from} – ${to}`;

        // Šipka vpravo je aktivní jen když nejsme na nejnovějším okně
        document.getElementById("btnNewer").disabled = (offsetHours === 0);

        // Spodní informační řádek + čas aktualizace
        const nowStr = new Date().toLocaleString("cs-CZ");
        const info = feeds.length > 0
          ? `Načteno ${feeds.length} bodů · Poslední aktualizace: ${nowStr}`
          : `V tomto období nejsou data · Poslední aktualizace: ${nowStr}`;

        document.getElementById("lastUpdate").textContent = info;

      } catch (err) {
        console.error(err);
        document.getElementById("lastUpdate").textContent =
          "Chyba načítání dat – zkontroluj Channel ID a připojení";
      }
    }

    // =====================================================================
    //  AKTUALIZACE KARET S AKTUÁLNÍMI HODNOTAMI (nahoře)
    // =====================================================================
    function updateStats(lastFeed) {
      if (!lastFeed) return;

      const html = Object.values(FIELDS).map(cfg => {
        const val = parseFloat(lastFeed[`field${cfg.field}`]);
        const unit = cfg.field === 5 ? " %" : " °C";
        const cls  = cfg.field === 5 ? "hum" : "temp";

        return `
          <div class="stat">
            <div class="stat-label">${cfg.label}</div>
            <div class="stat-value ${cls}">
              ${isNaN(val) ? "–" : val.toFixed(1) + unit}
            </div>
          </div>
        `;
      }).join("");

      document.getElementById("stats").innerHTML = html;
    }

    // =====================================================================
    //  OVLÁDÁNÍ TLAČÍTEK
    // =====================================================================

    // --- Tlačítka „Období“ (mění šířku okna grafu) ---
    document.querySelectorAll(".time-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        // Zvýrazníme aktivní tlačítko
        document.querySelectorAll(".time-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        // Uložíme novou šířku okna a skočíme na současnost
        currentHours = parseFloat(btn.dataset.hours);
        offsetHours = 0;
        loadData();
      });
    });

    // --- Tlačítka „Posun o“ (mění velikost kroku šipek) ---
    document.querySelectorAll(".step-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".step-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        // Jen si zapamatujeme nový krok, data nenačítáme
        stepHours = parseFloat(btn.dataset.hours);
      });
    });

    // --- Šipka doleva = starší data ---
    document.getElementById("btnOlder").addEventListener("click", () => {
      offsetHours += stepHours;     // posuneme se o zvolený krok do minulosti
      loadData();
    });

    // --- Šipka doprava = novější data ---
    document.getElementById("btnNewer").addEventListener("click", () => {
      offsetHours = Math.max(0, offsetHours - stepHours);
      loadData();
    });

    // =====================================================================
    //  START STRÁNKY
    // =====================================================================
    createChart();   // nejdřív vytvoříme prázdný graf
    loadData();      // hned načteme data

    // Každých 60 sekund obnovíme data, ale jen když se díváme na aktuální období
    setInterval(() => {
      if (offsetHours === 0) {
        loadData();
      }
    }, 60 * 1000);
  </script>
</body>
</html>
